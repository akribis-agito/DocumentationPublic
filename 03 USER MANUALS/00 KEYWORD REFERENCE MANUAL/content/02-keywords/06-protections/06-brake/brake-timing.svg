<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" role="img" aria-label="Static brake timing for BrakeMode = 3 with four signal lanes (command, brake, motor, StatReg bit 29). When the enable command rises, the brake is released first and the motor is armed after BrakeRelTime, at which point StatReg bit 29 clears. When the command falls, StatReg bit 29 sets immediately with the lock command, and the motor stays enabled for BrakeLockTime so the brake can engage before the motor is turned off. The bit-29 clear is delayed to the end of the release window, but the bit-29 set is immediate. Fail-safe convention: de-energized equals engaged.">
  <title>Static brake timing &#8211; BrakeMode = 3 (automatic by motor-on)</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b6b7b"/></marker></defs>

  <text x="20" y="26" font-size="15" font-weight="bold">Static brake timing &#8211; BrakeMode = 3 (automatic by motor-on)</text>

  <!-- Four lanes: command, brake, motor, StatReg bit 29 -->
  <g font-size="12" fill="#333">
    <text x="20" y="78" font-weight="bold">command (MotorOn)</text>
    <text x="20" y="158" font-weight="bold">brake</text>
    <text x="20" y="238" font-weight="bold">motor</text>
    <text x="20" y="318" font-weight="bold">StatReg bit 29</text>
  </g>

  <!-- Lane 1: command -->
  <line x1="180" y1="80" x2="700" y2="80" stroke="#bcc7d6"/>
  <line x1="180" y1="60" x2="180" y2="80" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="180" y1="60" x2="500" y2="60" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="500" y1="60" x2="500" y2="80" stroke="#2c6ed5" stroke-width="2"/>
  <text x="340" y="54" text-anchor="middle" fill="#2c6ed5" font-size="11">on</text>
  <text x="200" y="98" text-anchor="middle" font-size="11" fill="#555">enable</text>
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#555">disable</text>

  <!-- Lane 2: brake (released/engaged). De-energized = engaged. Show "released" raised. -->
  <line x1="180" y1="160" x2="700" y2="160" stroke="#bcc7d6"/>
  <line x1="180" y1="160" x2="180" y2="140" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="180" y1="140" x2="500" y2="140" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="500" y1="140" x2="500" y2="160" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="500" y1="160" x2="700" y2="160" stroke="#2c6ed5" stroke-width="2"/>
  <text x="340" y="134" text-anchor="middle" fill="#2c6ed5" font-size="11">released (energized)</text>
  <text x="600" y="178" text-anchor="middle" fill="#2c6ed5" font-size="11">engaged (de&#8209;energized)</text>

  <!-- Lane 3: motor armed (delayed by BrakeRelTime; turned off after BrakeLockTime) -->
  <line x1="180" y1="240" x2="700" y2="240" stroke="#bcc7d6"/>
  <line x1="180" y1="240" x2="280" y2="240" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="280" y1="240" x2="280" y2="220" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="280" y1="220" x2="580" y2="220" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="580" y1="220" x2="580" y2="240" stroke="#2c6ed5" stroke-width="2"/>
  <line x1="580" y1="240" x2="700" y2="240" stroke="#2c6ed5" stroke-width="2"/>
  <text x="430" y="214" text-anchor="middle" fill="#2c6ed5" font-size="11">motor enabled / motion allowed</text>

  <!-- Lane 4: StatReg bit 29 (lock requested). High = set. Clear is delayed; set is immediate. -->
  <line x1="180" y1="320" x2="700" y2="320" stroke="#bcc7d6"/>
  <line x1="180" y1="300" x2="280" y2="300" stroke="#b8562f" stroke-width="2"/>
  <line x1="280" y1="300" x2="280" y2="320" stroke="#b8562f" stroke-width="2"/>
  <line x1="280" y1="320" x2="500" y2="320" stroke="#b8562f" stroke-width="2"/>
  <line x1="500" y1="320" x2="500" y2="300" stroke="#b8562f" stroke-width="2"/>
  <line x1="500" y1="300" x2="700" y2="300" stroke="#b8562f" stroke-width="2"/>
  <text x="225" y="294" text-anchor="middle" fill="#b8562f" font-size="11">set</text>
  <text x="390" y="338" text-anchor="middle" fill="#b8562f" font-size="11">clear (release requested)</text>
  <text x="600" y="294" text-anchor="middle" fill="#b8562f" font-size="11">set (lock requested)</text>

  <!-- BrakeRelTime bracket (between brake released and motion allowed) -->
  <line x1="180" y1="356" x2="280" y2="356" stroke="#5b6b7b" stroke-width="1.2"/>
  <line x1="180" y1="352" x2="180" y2="360" stroke="#5b6b7b" stroke-width="1.2"/>
  <line x1="280" y1="352" x2="280" y2="360" stroke="#5b6b7b" stroke-width="1.2"/>
  <text x="230" y="374" text-anchor="middle" font-weight="bold" fill="#333">BrakeRelTime</text>
  <text x="230" y="388" text-anchor="middle" font-size="11" fill="#555">(brake opens before motion)</text>

  <!-- BrakeLockTime bracket (between disable command and motor off) -->
  <line x1="500" y1="356" x2="580" y2="356" stroke="#5b6b7b" stroke-width="1.2"/>
  <line x1="500" y1="352" x2="500" y2="360" stroke="#5b6b7b" stroke-width="1.2"/>
  <line x1="580" y1="352" x2="580" y2="360" stroke="#5b6b7b" stroke-width="1.2"/>
  <text x="540" y="374" text-anchor="middle" font-weight="bold" fill="#333">BrakeLockTime</text>
  <text x="540" y="388" text-anchor="middle" font-size="11" fill="#555">(brake holds before motor off)</text>

  <!-- vertical guides at key events -->
  <line x1="180" y1="40" x2="180" y2="344" stroke="#9fb4cc" stroke-dasharray="3 3"/>
  <line x1="280" y1="220" x2="280" y2="344" stroke="#9fb4cc" stroke-dasharray="3 3"/>
  <line x1="500" y1="40" x2="500" y2="344" stroke="#9fb4cc" stroke-dasharray="3 3"/>
  <line x1="580" y1="220" x2="580" y2="344" stroke="#9fb4cc" stroke-dasharray="3 3"/>

  <text x="20" y="410" fill="#555" font-size="11">Fail-safe convention: de-energized = engaged (holding). Bit 29 is asymmetric: it <tspan font-style="italic">clears</tspan> when the release timer elapses,</text>
  <text x="20" y="426" fill="#555" font-size="11">but <tspan font-style="italic">sets</tspan> the moment the lock is commanded. Other BrakeMode values (0, 1, 2, 4) skip these timed waits.</text>
</svg>
