// keyword-frontmatter.schema.yml
//
// Canonical contract for the YAML frontmatter on every keyword doc.
// Use this as the single reference when rendering a keyword page (web or C#)
// or when validating generator output. It documents each field, its type,
// allowed values, whether it is generated or authored, and how it drives the
// rendered page (the "render mapping" section at the bottom).
//
// Source of truth for facts: firmware KeywordsTableArray (AG300_CTL01Params.c),
// extracted by tools/keyword-docgen. Prose (body) and `summary` are authored.

version: 2

# ---------------------------------------------------------------------------
# Field reference
# ---------------------------------------------------------------------------
fields:

  keyword:
    type: string
    origin: generated   # mirrors the doc filename / mnemonic
    required: true
    description: Mnemonic of the keyword.

  summary:
    type: string
    origin: authored
    required: false
    description: One-line description shown under the page title.

  language:
    type: enum
    values: [en, zh-CN]
    origin: authored-by-translation
    required: false
    description: >
      Language of the AUTHORED prose (summary + body) in this file. Absent means
      English (en). A translated sidecar `<Keyword>.zh.md` carries
      `language: zh-CN`; its generated facts are copied verbatim from the English
      file (they are language-neutral) while its summary and body are the
      translation. Never hand-set on an English file.

  can_code:
    type: integer
    origin: generated
    required: true
    description: >
      CAN code of the PRIMARY cell. The CAN code can differ between product types;
      when it does, the differing cell's can_code appears inside its `overrides`
      entry (treated like any other divergent field). Renderers should show the
      primary can_code with a divergence marker when an override carries can_code.

  category:
    type: string
    origin: authored
    required: false
    description: Category slug (e.g. control-tuning, system).

  availability:
    type: list
    items: { type: enum, values: [controller, ci-master] }
    origin: generated
    required: true
    description: >
      The firmware product types (v5) this keyword exists on, in this order.
      `controller` is every CONTROLLER product (drives and controllers, 32-bit
      control width); `ci-master` is CI_MASTER, the AGM800 family (64-bit).
    example: [controller, ci-master]

  products:
    type: list
    items: string
    origin: generated
    required: false
    description: >
      Catalog IDs, lowercase (`PRODUCT_AGD155_EC` -> `agd155-ec`), of the
      products that have this keyword, listed only for a product type on which
      some products lack it. A type in `availability` with none of its products
      listed here means every product of that type. Absent means every product
      of every type in `availability`.
    example: [agd155-ec, agd155-ec-var34, agd156-ec]

  attributes:
    type: object
    origin: generated
    required: true
    description: >
      Facts for the PRIMARY cell: `controller` if it is in `availability`,
      otherwise `ci-master`. Every field below is rendered in Quick Facts.
    properties:
      access:       { type: enum, values: [ro, rw] }
      scope:        { type: enum, values: [axis, non-axis] }
      flash:        { type: boolean }                       # saved to flash
      type:         { type: enum, values: [scalar, array] }
      array_size:   { type: integer }                       # firmware MaxArrayIndex + 1;
                                                            # includes reserved slot 0, so
                                                            # highest USABLE index = array_size - 1
                                                            # (arrays are 1-indexed; [0] is not accessible)
      data_type:    { type: enum, values: [int32, float32, int64, float64] }
      ok_in_motion: { type: boolean }
      ok_motor_on:  { type: boolean }
      units:        { type: enum, values: [user, none, func, aux_user_units, pd_user_units, scaling] }
      range:        { type: "list[2] | null", items: integer }   # [min, max], or null if unresolved
      default:      { type: "integer | null" }
      scaling:      { type: number }
      implemented:  { type: enum, values: [final, partial, not_implemented, future] }

  overrides:
    type: object
    origin: generated
    required: false
    description: >
      Two kinds of key, each mapping to a partial map containing ONLY the fields
      that differ (any attributes field AND `can_code`). Drives the divergence
      markers.
      A product type key (`controller` / `ci-master`) holds the non-primary
      type's deltas from the primary cell.
      A catalog ID key (lowercase, as in `products`, e.g. `agd155-ec`) holds one
      product's deltas from its own type's cell (the primary cell plus that
      type's entry). A type's cell carries the facts of its reference product
      (agd301-et-2d05 for controller, agm800 for ci-master, or the type's first
      product that has the keyword when the reference does not); a cell value
      applies to every product of the type that has the keyword and no catalog
      ID entry for that field. Type keys come first, then catalog IDs in
      ProductConfig.h order.
    example:   # CurrRef: the controller cell (agd301-et-2d05) is range [-16000, 16000]
      ci-master: { range: [-64000, 64000] }
      agd200-et-2d01: { range: [-4000, 4000] }
      agd155-ec: { range: [-25500, 25500] }

# ---------------------------------------------------------------------------
# data_type vocabulary (display labels)
# ---------------------------------------------------------------------------
data_type_labels:
  int32:   "32-bit integer (long)"
  float32: "32-bit float"
  int64:   "64-bit integer (long long)"
  float64: "64-bit double"

# ---------------------------------------------------------------------------
# Product type vocabulary (display labels)
# ---------------------------------------------------------------------------
product_type_labels:
  controller: "Drives & controllers (32-bit)"
  ci-master:  "AGM800 Central-i master (64-bit)"

# ---------------------------------------------------------------------------
# Render mapping — how a renderer turns this frontmatter into the page
# ---------------------------------------------------------------------------
render_mapping:
  title:            "# heading + summary line"
  availability:     "one-row strip of two cells, controller then ci-master, labelled from product_type_labels. Cell = present / present-but-differs / n/a; a cell whose type has products listed in `products` names them."
  primary_cell:     "controller if available, else ci-master; its attributes populate Quick Facts in full."
  quick_facts:      "one row per attributes.* field (primary-cell values). A field that a catalog-ID override carries is product-dependent: its row says so and is never shown as a single value for the whole type."
  divergence_dot:   "a field gets a marker if it appears in overrides.ci-master (or overrides.controller); the other type's value is shown on hover/expand from that override."
  per_product:      "a field carried by any catalog-ID override expands to a per-product list: each listed product with its own value (labelled with its catalog ID), and the cell value for the type's remaining products."
  array_indexing:   "present array indexes starting at 1 (index 0 is reserved/inaccessible)."
  behavioural_diff: "authored body prose for behaviour that differs between product types (not derivable from facts)."
